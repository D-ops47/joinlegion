[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Anonymous analytics runs as same-origin Netlify Functions at /api/*.
# Each function declares its own route via the exported `config.path`, so no
# redirect rules are needed. Storage is Netlify Blobs — no external service.
# ---------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Security headers. GitHub Pages could not set these; Netlify can.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, cover subdomains, allow preload list submission.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Block MIME-type sniffing.
    X-Content-Type-Options = "nosniff"

    # Block framing (clickjacking). CSP frame-ancestors below is the modern
    # equivalent; X-Frame-Options is kept for older browsers.
    X-Frame-Options = "DENY"

    # Trim referrer leakage on outbound links.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Deny access to device APIs the site does not use.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=()"

    # Content Security Policy.
    # 'unsafe-inline' is required for script-src and style-src because the site
    # uses inline <script> and <style> blocks. Tighten script-src to nonces if
    # those are ever moved to external files.
    #
    # connect-src is now just 'self': analytics moved off Railway onto
    # same-origin Netlify Functions, so no third-party endpoint needs allowing.
    #
    # The agent clips are animated WebP images, so they are governed by img-src,
    # not media-src. media-src 'self' is kept deliberately: it costs nothing and
    # keeps the policy correct if a real <video> or <audio> is ever added back.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# CSP for the proxied app at /app/*.
#
# The app is fetched from Lovable but served from OUR origin, so the site-wide
# CSP above applies to it. That policy is deliberately tight for a static
# marketing site and would break the app, which:
#   - loads a webfont from https://cdn.gpteng.co
#   - is a bundled SPA that evaluates inline and blob-backed script
#   - stores its own icons and preview images
#
# Rather than loosen the site-wide policy and weaken every page for the sake of
# one path, this header overrides CSP for /app/* only. Netlify applies the most
# specific matching header block, so the homepage and card keep the strict
# policy untouched.
#
# This is still a real policy, not an opt-out: object-src stays 'none',
# base-uri stays 'self', and frame-ancestors stays 'none' so the app cannot be
# framed. It is looser than the marketing pages because it has to be, and no
# looser than that.
#
# NOTE: whoever owns the Lovable project can add third-party origins at any
# time by editing the app. If something in the app silently stops working after
# a Lovable change, check the browser console for a CSP violation here FIRST —
# it will work on the .lovable.app URL (no CSP) and fail only under the proxy,
# which makes it look like a proxy bug when it is a policy gap.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.gpteng.co; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Long-cache static assets.
#
# Scoped to /assets/* on THIS site. The proxied app's own bundles live under
# /app/assets/* and are intentionally NOT matched here: Lovable fingerprints
# its filenames and sets its own cache headers, and a year-long immutable cache
# applied by us would keep serving a stale build after the user hits Publish.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirects. ORDER MATTERS: Netlify applies the first matching rule, so the
# 404 catch-all must stay last and must never shadow /api/*.
# ---------------------------------------------------------------------------

# 1. Consolidate www -> apex so there is one canonical origin.
[[redirects]]
  from = "https://www.joinlegion.ai/*"
  to = "https://joinlegion.ai/:splat"
  status = 301
  force = true

# 2. COURSE GATE.
#
# The course is unfinished, so removing the button is not enough on its own:
# /course stays deployed and reachable by anyone who typed it, bookmarked it,
# or follows a cached link. These rules send every route into it back to the
# card, so there is exactly one way in and it is currently closed.
#
# 302, not 301: this is temporary. A 301 would be cached by browsers and could
# keep redirecting people even after the course is published.
#
# Placed ABOVE the clean-URL rules because Netlify applies the first match.
[[redirects]]
  from = "/course"
  to = "/card"
  status = 302
  force = true

[[redirects]]
  from = "/course.html"
  to = "/card"
  status = 302
  force = true

[[redirects]]
  from = "/course/*"
  to = "/card"
  status = 302
  force = true

# 3. THE APP — proxied, not redirected.
#
# /app/ serves the LEGION app, which is built and hosted on Lovable. status=200
# makes Netlify fetch it server-side and return it as our own response, so the
# address bar stays on joinlegion.ai/app/. A 301/302 would hand the visitor to
# your-first-agent.lovable.app and every link shared from inside the app would
# carry that address instead of ours.
#
# THE TRAILING SLASH IS LOAD-BEARING. The app's own HTML references its assets
# relatively:
#
#     <script src="./assets/index-*.js">
#     <link href="manifest.webmanifest">
#     <link href="icons/icon-192.png">
#
# From /app/ those resolve to /app/assets/..., which the proxy rule forwards.
# From /app (no slash) the browser treats "app" as a FILE, so ./assets/x.js
# resolves to /assets/x.js at the site root — where nothing exists, and every
# script, style and icon 404s. Hence the 301 below: it is not cosmetic, it is
# what keeps the app from loading blank.
#
# Client-side routing is not a concern here, which is why there is no SPA
# fallback rule. The app's navigation is button-driven and never changes the
# URL (verified: clicking Learn/Help/Legion leaves the address untouched, and
# the document contains no internal <a href> at all). There are therefore no
# deep links that could escape the proxy prefix.
#
# ORDER AND `force` BELOW ARE BOTH DELIBERATE. Netlify normalises trailing
# slashes when matching, so a rule written `from = "/app"` matches BOTH /app and
# /app/. Written with force = true it therefore captures /app/ as well and
# redirects it to /app/ — itself — which is an infinite 301 loop. That is not
# hypothetical; it was deployed and measured (final=301 after 5 hops).
#
# The fix is order plus the absence of force:
#   1. the proxy is FIRST, so /app/ and everything deeper is answered with 200
#      before the slash redirect is ever consulted
#   2. the slash redirect has NO force, so it only fires for the bare /app that
#      nothing above it served
#
# Reading this file cannot prove the loop is gone, because the rule list looks
# correct either way. Only requesting the URLs can. Verify both /app and /app/
# after any change here.
[[redirects]]
  from = "/app/*"
  to = "https://your-first-agent.lovable.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# The app requests exactly one path absolutely: <script src="/~flock.js">.
# Being absolute, under the proxy it resolves to joinlegion.ai/~flock.js, which
# does not exist on this site and would fall through to the 404 page. This
# forwards it to Lovable so the request succeeds instead of failing silently in
# the console. If Lovable ever drops that file this rule becomes harmless.
[[redirects]]
  from = "/~flock.js"
  to = "https://your-first-agent.lovable.app/~flock.js"
  status = 200
  force = true

# 4. Clean URLs.
#
# Netlify's Pretty URLs already RESOLVED /card as well as /card.html, which meant
# every page existed at two addresses returning 200 at the same time — duplicate
# content with no canonical signal. These 301s make the extensionless form the
# single real URL and permanently retire the .html form, so existing inbound
# links, bookmarks and previously shared links still land correctly.
#
# force = true is required: without it the static file at /card.html wins and
# the redirect never fires.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/card.html"
  to = "/card"
  status = 301
  force = true

# /app.html is the holding page that /app served before the app shipped. The
# file is deliberately KEPT in the repo: if the app ever has to come down for
# maintenance, commenting out the proxy above restores a branded page with a
# countdown instead of leaving visitors on a Netlify error.
#
# This 301 retires its .html address the same way every other page's is
# retired, and now lands on the proxied app rather than the holding page —
# which is correct, since anyone reaching /app.html today wants the app.
[[redirects]]
  from = "/app.html"
  to = "/app/"
  status = 301
  force = true

# NOTE: /course.html is handled by the course gate above, so it has no
# clean-URL rule here.

[[redirects]]
  from = "/avenues.html"
  to = "/avenues"
  status = 301
  force = true

[[redirects]]
  from = "/build-it-tutorial.html"
  to = "/build-it-tutorial"
  status = 301
  force = true

[[redirects]]
  from = "/battle-card-example.html"
  to = "/battle-card-example"
  status = 301
  force = true

# /404.html is deliberately NOT redirected — the 404 rule below serves it
# directly, and rewriting it would break the branded error page.

# 5. Serve the branded 404 page. MUST stay last so it never shadows /api/*.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
