<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>LEGION — Position Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000; --coal:#141414;
    --purple:#9933FF; --purple2:#8A2BE2; --purple3:#C084FC;
    --metal:#E0E0E0; --dust:#9aa0b5; --faint:#6b7080;
    --grad:linear-gradient(135deg,#8A2BE2,#9933FF);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(900px 600px at 20% 10%, rgba(153,51,255,.16) 0%, transparent 60%),
      radial-gradient(700px 500px at 85% 85%, rgba(138,43,226,.12) 0%, transparent 60%),
      var(--black);
    color:var(--metal);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow-x:hidden;
  }
  .frame{position:fixed;inset:14px;pointer-events:none;}
  .frame i{position:absolute;width:34px;height:34px;border:2px solid rgba(153,51,255,.5);}
  .frame i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;}
  .frame i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;}
  .frame i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;}
  .frame i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;}
  .wrap{max-width:620px;text-align:center;position:relative;z-index:2;}
  .shield{
    width:56px;height:64px;margin:0 auto 18px;
    background:var(--grad);
    clip-path:polygon(50% 0%,100% 18%,100% 62%,50% 100%,0% 62%,0% 18%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(153,51,255,.4);
  }
  .shield b{font-family:'Anton',sans-serif;color:#fff;font-size:26px;line-height:1;}
  .brand{
    font-family:'Oswald',sans-serif;letter-spacing:9px;font-size:19px;
    color:#fff;font-weight:600;margin-bottom:6px;
  }
  .eyebrow{
    font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3.5px;
    text-transform:uppercase;color:var(--purple3);margin-bottom:34px;font-weight:500;
  }
  .code{
    font-family:'Anton',sans-serif;
    font-size:clamp(80px,20vw,150px);
    line-height:.85;
    background:linear-gradient(180deg,#E0E0E0 0%,#9933FF 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:10px;
  }
  h1{
    font-family:'Anton',sans-serif;
    font-size:clamp(26px,5.5vw,40px);
    text-transform:uppercase;letter-spacing:.5px;
    color:#fff;margin-bottom:16px;line-height:1.1;
  }
  h1 span{color:var(--purple3);}
  p{font-size:16px;line-height:1.65;color:var(--dust);margin-bottom:12px;}
  p b{color:var(--metal);font-weight:600;}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:32px;}
  .btn{
    display:inline-block;text-decoration:none;
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:15px;letter-spacing:1.5px;text-transform:uppercase;
    padding:15px 28px;border-radius:11px;
    transition:.16s;
  }
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 34px rgba(153,51,255,.34);}
  .btn.primary:hover{filter:brightness(1.13);transform:translateY(-2px);}
  .btn.ghost{border:1px solid rgba(153,51,255,.45);color:var(--purple3);}
  .btn.ghost:hover{background:rgba(153,51,255,.1);border-color:var(--purple3);}
  .foot{margin-top:44px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);font-family:'Oswald',sans-serif;}
</style>
</head>
<body>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="shield"><b>L</b></div>
  <div class="brand">LEGION</div>
  <div class="eyebrow">Bring your superpower</div>

  <div class="code">404</div>
  <h1>This position <span>doesn't exist.</span></h1>
  <p>The page you're looking for isn't on the map. <b>No ground lost</b> — regroup and pick your next move.</p>

  <div class="actions">
    <a class="btn primary" href="/">&#9876;&#65039; Back to Base</a>
    <a class="btn ghost" href="/card.html">Build My Card &#8594;</a>
  </div>

  <div class="foot">LEGION &copy; 2026</div>
</div>
</body>
</html>
